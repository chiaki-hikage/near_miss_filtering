# ヒヤリハット候補の抽出条件
#
# ここに書いた値以外の閾値をコードへ埋め込まない。
# 閾値を変えた実行は config_hash が変わるので、出力側で区別できる。

# ---------------------------------------------------------------------------
# 前処理: 一様グリッドへの再サンプル
#   CAN の受信時刻は最小 0.2 ms まで詰まることがあり、生の時刻で微分すると
#   量子化ノイズが 100 m/s^2 規模まで増幅される。docs/signals_rav4.md を参照。
# ---------------------------------------------------------------------------
resample:
  rate_hz: 20.0
  max_gap_s: 0.5          # これを超える受信間隔は欠測として品質フラグを立てる
  edge_trim_s: 0.6        # 平滑化の端の影響を除くため両端から捨てる秒数

smoothing:
  speed_window_s: 0.25    # 車速。0.01 km/h 量子化ノイズの除去
  steer_window_s: 0.15    # 舵角
  accel_window_s: 0.25    # 微分後の縦加速度
  # 4 輪速。生のばらつきは 1 サンプルごとの符号反転率が 62〜67% (白色雑音なら 50%) で、
  # 高周波ノイズが支配的。平滑化せずに閾値を置くとノイズの尖りだけを拾う。
  wheel_speed_window_s: 0.3

# ---------------------------------------------------------------------------
# 先行車の選択と車間指標
# ---------------------------------------------------------------------------
lead:
  lane_half_width_m: 1.8  # 自車レーン判定の横方向しきい値
  min_distance_m: 1.0
  max_distance_m: 150.0
  max_hold_s: 0.5         # 直近の観測をこの秒数まで保持する。超えたら欠測扱い
  min_ego_speed_mps: 5.0  # これ未満では THW / TTC を算出しない

  # 静止物を先行車から外す。
  #   路側の標識・ガードレール・停車車両は相対速度が -自車速 になるため、
  #   TTC = 距離 / 自車速 となって恒常的に小さい値を出す。Chunk_1 では
  #   low_ttc の検出 25 件すべてがこれだった (先行車の絶対速度の中央値 -0.13 m/s)。
  #   実在の先行車 (short_thw の 17 件) は絶対速度の中央値 29.4 m/s で、
  #   この足切りでは 1 件も落ちない。
  min_target_speed_mps: 2.0     # 先行車の絶対速度の下限
  min_target_speed_ratio: 0.2   # 同じく自車速に対する比

  # 旋回中は正面に取った帯が路側を掃く。自車のヨーレートから曲率を出し、
  # 進路の曲がりぶんだけ帯をずらす。
  curvature_compensation: true
  curvature_min_speed_mps: 3.0  # これ未満では曲率が発散するので補正しない

# ---------------------------------------------------------------------------
# 蛇行の判定
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 補助特徴量の移動窓
#   躍度は微分 2 回でノイズが乗る (Chunk_1 実測で 1 サンプルごとの符号反転率が
#   縦躍度 23.9% / 横躍度 14.2%。縦加速度は 3.9%)。単独のイベント判定には使わず、
#   この窓で均した値を候補行に添えて、確認時の材料にする。
# ---------------------------------------------------------------------------
auxiliary:
  window_s: 0.3

# ---------------------------------------------------------------------------
# 車線変更の候補 (S 字状の横運動)
#   comma2k19 には車線マーカの正解が無いため、車線変更と断定はできない。
#   運動の形だけで拾い、名前も candidate に留める。
#   道路の曲率はヨーレートに定常成分として乗るので、長い移動平均を引いて除く。
# ---------------------------------------------------------------------------
lane_change:
  curvature_window_s: 10.0    # 道路の曲率とみなして除去する窓長 (中央値フィルタ)
  enter_dps: 0.6              # 振れとみなすヨーレート偏差の下限
  lobe_merge_gap_s: 0.5       # 同符号の振れをつなぐ許容間隔
  pair_max_gap_s: 3.0         # 左右一組とみなす振れの間隔の上限
                              # 実際の車線変更は切り返しまでの間隔が長い。
                              # 2.0 では Chunk_1 のローブ対 323 件がここで落ちた
  min_lobe_heading_deg: 1.5   # 各振れの方位角変化の下限
  max_net_heading_deg: 2.5    # 一組全体の方位角変化の上限 (元の向きに戻ること)
  min_duration_s: 1.0
  max_duration_s: 8.0
  min_offset_m: 2.0           # 推定横変位の範囲。1 車線幅の目安は 3.5 m
  max_offset_m: 6.0
  min_speed_mps: 10.0

# ---------------------------------------------------------------------------
# 車両物理モデル
#   舵角から期待されるヨーレートを線形単軌道モデルで出し、実測との差を見る。
#   係数は車種設定 (configs/vehicles/*.yaml の geometry) に持たせてある。
#   定常状態のモデルなので、操舵の立ち上がりでは実測が遅れて差が出る。
#   Chunk_1 実測で残差の標準偏差は 0.341 deg/s、|残差| の p99.9 は 1.47 deg/s。
# ---------------------------------------------------------------------------
physics:
  min_speed_mps: 3.0            # これ未満はモデルが発散するので算出しない
  counter_steer_min_yaw_dps: 3.0    # 逆操舵とみなすヨーレートの下限
  counter_steer_min_rate_dps: 15.0  # 同じく舵角レートの下限

# ---------------------------------------------------------------------------
# 回避 (出て戻る S 字)
#   車線変更は横へ移ってそこに留まる。回避は横へ出て元へ戻る。
#   横変位の軌跡で切り分ける。
# ---------------------------------------------------------------------------
s_evasion:
  curvature_window_s: 10.0
  enter_dps: 1.0
  lobe_merge_gap_s: 0.3
  lobe_gap_s: 1.5
  min_lobes: 3                  # 出て戻るには最低 3 つの振れが要る
  min_duration_s: 1.0
  max_duration_s: 5.0           # 蛇行より短いこと
  min_lateral_accel_mps2: 2.0   # 回避と言える強さ
  min_excursion_m: 1.2          # 途中でこれだけふくらむこと
  max_return_m: 1.0             # 最後は元へ戻ること
  min_speed_mps: 10.0

# ---------------------------------------------------------------------------
# アクセル急 OFF からの強い制動
#   アクセル開度は復号できていないので、縦加速度が正から強い負へ
#   短時間で切り替わることで代用する。
# ---------------------------------------------------------------------------
panic_brake:
  lookback_s: 1.5               # 何秒前まで遡って加速していたかを見る
  accel_threshold: 0.3          # 直前に加速していたとみなす縦加速度
  brake_threshold: -3.0         # 強い制動とみなす縦加速度

  # アクセル開度が復号できる場合の判定。運転者の動作そのものを見る。
  #   踏んでいた → 離した → 短時間でブレーキと強い減速
  # ブレーキ量は単位が確定していないため、離した時点からの立ち上がり量で見る。
  pedal:
    min_gas_pct: 5.0            # 直前に踏んでいたとみなすアクセル開度
    released_pct: 1.0           # 離したとみなす開度
    release_window_s: 0.5       # 直前この秒数の間に踏んでいたこと
    reaction_window_s: 1.5      # 離してからこの秒数以内に制動が立つこと
    min_brake_rise: 8.0         # ブレーキ踏み込み量の立ち上がり (相対値)
    brake_threshold: -2.5       # かつ縦加速度がこれ以下になること

# ---------------------------------------------------------------------------
# 輪速の異常
#   4 輪速のばらつきは、定常旋回では外輪と内輪の差として正常にも開く。
#   その量はトレッド幅で決まる (左右差 = ヨーレート[rad/s] × トレッド幅)。
#   実測の当てはめでトレッド幅は RAV4 2017 が 1.636 m、TSS2 が 1.637 m。
#   さらに区間ごとの中央値を引く。タイヤの摩耗・空気圧で車両ごとに常時ずれがあり、
#   実測でも中央値が 0.066 m/s (2017) と 0.262 m/s (TSS2) で 4 倍違った。
#
#   単独ではスリップと判定しない。加減速・ヨー応答の乖離・ABS のいずれかが
#   同じころに立っていることを求める。
# ---------------------------------------------------------------------------
wheel_speed:
  # 判定は 0.3 秒平滑化した輪速から作る (smoothing.wheel_speed_window_s)。
  # 平滑化後の超過は、comma2k19 の 3.1 時間と TSS2 の 15 分を合わせても
  # p99.9 = 0.16 m/s、最大 0.27 m/s しかない。
  # 閾値 0.4 m/s はノイズ床の 2.5 倍で、車速 25 m/s に対して 1.6% の滑りにあたる。
  # この水準で発火が 0 件なら「このデータに輪速の異常は無い」と読む。
  min_excess_mps: 0.4
  min_speed_mps: 5.0
  tolerance_s: 0.5              # 裏付けの信号との時間ずれの許容
  corroborate_ax_mps2: 1.5      # 駆動・制動によるスリップとみなす縦加速度
  corroborate_yaw_sigma: 3.0    # 車両が舵に従っていないとみなすヨー残差 (σ)

# ---------------------------------------------------------------------------
# 同一の先行車への急接近 (割り込みではない詰まり方)
# ---------------------------------------------------------------------------
closing:
  max_thw_rate: -0.40           # 車間時間がこの速さで縮んでいること [s/s]
  max_thw_s: 1.5                # かつ車間時間そのものが小さいこと

# ---------------------------------------------------------------------------
# 割り込み (カットイン)
#   目視判定でリスクとされた車間逼迫は、いずれも他車が前方に割り込んだ場面だった。
#   車間時間の絶対値より、割り込みで急に詰まったことが危険の中身にあたる。
#   主判定は距離の不連続。実在の車両は 1 サンプル (0.05 秒) で数十 m も動けない。
#   トラック ID の変化は補助。レーダは枠を使い回しており、同じ車両でも ID が
#   頻繁に入れ替わる (実測で 14 秒間に 28〜92 回)。ID の一定性を条件にすると
#   実際の割り込みが 1 件も取れなかった。
# ---------------------------------------------------------------------------
cut_in:
  min_jump_m: 5.0             # 1 サンプルでの距離の跳び。実在の車両は跳ばない
  persist_s: 0.8              # 入れ替わった後の状態をこの秒数ぶん見る
  min_distance_drop_m: 10.0   # 入れ替わりで車間がこれだけ縮むこと
  max_appear_distance_m: 40.0 # 先行車がいなかった場合、この距離以内に現れること
  max_thw_after_s: 0.8        # 入れ替わった先の車間時間の上限。
                              # 既知の割り込み 4 件は 0.23〜0.51 s だった。
                              # 1.8 では 26 件/時と多すぎ、0.8 で 10 件/時になる
  min_speed_mps: 8.0
  window_s: 3.0               # 発生時刻から何秒を割り込みの区間とみなすか

# ---------------------------------------------------------------------------
# 蛇行
#   舵角の符号反転を数えるだけの定義では、通常の複数車線変更を拾っていた
#   (目視判定 6 件がすべて通常運転)。急な左右操作が短時間に繰り返され、
#   かつ元の向きへ戻ることを条件にする。
# ---------------------------------------------------------------------------
weaving:
  curvature_window_s: 10.0    # 道路の曲率を除く窓長 (中央値フィルタ)
  enter_dps: 1.0              # 振れとみなすヨーレート偏差の下限
  lobe_merge_gap_s: 0.3       # 同符号の振れをつなぐ許容間隔
  lobe_gap_s: 2.0             # 交互の振れとみなす間隔の上限
  min_reversals: 3            # 左右交互の振れがこの回数以上
  min_lateral_accel_mps2: 1.0 # 各振れが横加速度で裏付けられること
  min_steer_rate_dps: 8.0     # 各振れが舵角レートで裏付けられること
  min_duration_s: 2.0
  max_duration_s: 8.0         # 短時間に集中していること
  max_net_heading_deg: 8.0    # 元の向きへ戻ること。単方向の連続車線変更を除く
  min_speed_mps: 10.0
  # 補助特徴量 steer_reversals 用 (判定には使わない)
  detrend_window_s: 5.0
  amplitude_deg: 3.0
  count_window_s: 10.0

# ---------------------------------------------------------------------------
# 通常の旋回を除くための正味方位角
#   左折・ランプ・長いカーブは向きが変わり続けるので大きな値になる。
#   回避操作や車線変更は元の向きへ戻るので小さい。
# ---------------------------------------------------------------------------
turn:
  half_window_s: 3.0          # 各時刻の前後この秒数で方位角の変化を取る
  max_net_heading_deg: 15.0   # これを超える区間は旋回とみなして判定しない

# ---------------------------------------------------------------------------
# イベント定義
#   feature : features.py が作る列名
#   op      : lt (未満) / gt (超過) / abs_gt (絶対値が超過) / rising (0→1 の立ち上がり)
#             agreement (複数信号がそろって条件を満たす。conditions と併記する)
#             cooccurrence (別のイベントに危険側の指標が重なる)
#             sequence (先に起きる事象と、その後に続く事象の並び)
#   stage   : 1 = processed_log だけで判定できる / 2 = raw_can の復号が要る
#   gate    : この条件が成り立つ区間だけ判定する (省略可)
# ---------------------------------------------------------------------------
events:
  hard_brake:
    label: "急ブレーキ"
    feature: ax_mps2
    op: lt
    threshold: -2.5          # Chunk_1 実測の p0.1 = -2.69。-3.0 では 5 件、-2.5 で 11 件
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 1
    weight: 1.0

  hard_accel:
    label: "急加速"
    feature: ax_mps2
    op: gt
    threshold: 2.5
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 1
    weight: 0.4

  # 制動ジャークは独立イベントから外した。閾値超過が持続的な現象として存在せず
  # (最短継続 0.30s で 0 件)、継続時間でノイズを削っていただけだったため。
  # 縦方向の急変は hard_brake (ax_mps2) を主判定とし、躍度は
  # jerk_win_min / jerk_win_mean を候補行に添えるだけにする。

  # 急操舵は 1 つの信号では判定しない。独立した 3 系統がそろって立つことを条件にする。
  #   steer_rate_dps  舵角センサ      運転者の入力
  #   ay_kin_mps2     ヨーレートセンサ × 車速   車両の応答
  #   ay_can_mps2     横加速度センサ  独立した実測
  # 1 系統だけのノイズや欠損由来のスパイクは、他が裏付けないので通らない。
  #
  # ヨーレートは生の大きさではなく車速を掛けた形 (ay_kin) で使う。
  # ay = 車速 × ヨーレート なので、ヨーレートに固定の下限を置くと、
  # 高速ほど大きな横加速度を要求してしまう。実測では 100 km/h で 5.82 m/s^2、
  # 120 km/h で 6.98 m/s^2 を要求する計算になり、Chunk_1 の |ay_kin| 最大 4.89 を
  # 超える。実際、ヨーレートに 12 deg/s を課した版は 90 km/h 超で発火率 0.0% だった。
  # ヒヤリハットが問題になる速度域を丸ごと落とすため、この形にしている。
  #
  # ay_can の閾値は ay_kin 側の 0.68 倍。横加速度計は路面カントのぶんだけ
  # 小さく読み、実測の回帰係数が 0.678 だったことによる (docs/signals_rav4.md)。
  # ここでは大きさの根拠ではなく裏取りに使うだけなので、スケール未確定でも差し支えない。
  #
  # 閾値は Chunk_1 実測で、3 条件の連言が全サンプルの 0.12% になる水準。
  hard_steer:
    label: "急操舵"
    op: agreement
    feature: ay_kin_mps2      # 代表値。スコア計算に使う。conditions のいずれかを指す
    tolerance_s: 0.3          # 信号間の時間ずれの許容。各条件を前後に広げてから連言を取る
    conditions:
      - {feature: steer_rate_dps, op: abs_gt, threshold: 25.0}
      - {feature: ay_kin_mps2,    op: abs_gt, threshold: 2.0}
      - {feature: ay_can_mps2,    op: abs_gt, threshold: 1.4}
    min_duration_s: 0.15
    merge_gap_s: 1.0
    stage: 2
    # 上位を目視確認したところ、通常のカーブ走行やバイパスへの左折だった。
    # 候補には残すが、単独では上位に来ないよう重みを下げてある。
    weight: 0.3
    # 左折・ランプ・長いカーブを除く。前後 3 秒で向きが戻るものだけを残す。
    gate:
      - {feature: net_heading_win_deg, op: lt, threshold: 15.0}
      - {feature: v_mps, op: gt, threshold: 5.0}

  # 横加速度は ay_kin (= v × yaw_rate) を使う。YAW_RATE のスケールは
  # global_pose を基準に検証済み (回帰係数 0.988)。ACCEL_Y は路面カントの
  # 寄与と区別できずスケールが確定していないため主系列にしない。
  lateral_accel:
    label: "横加速度過大"
    feature: ay_kin_mps2
    op: abs_gt
    threshold: 3.0          # Chunk_1 実測の |値| p99.5 = 2.60 / p99.9 = 3.58
    min_duration_s: 0.2
    merge_gap_s: 1.0
    stage: 2
    weight: 0.3    # hard_steer と同じ理由で下げてある
    gate:
      - {feature: net_heading_win_deg, op: lt, threshold: 15.0}
      - {feature: v_mps, op: gt, threshold: 5.0}

  # 判定量は weave_active。急な左右操作が短時間に 3 回以上交互に起き、
  # 横加速度と舵角レートの両方で裏付けられ、かつ元の向きへ戻ることを条件にする。
  # 設定は weaving 節。
  weaving:
    label: "蛇行"
    feature: weave_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.5
    merge_gap_s: 2.0
    stage: 2
    weight: 0.5

  short_thw:
    label: "車間時間過小"
    feature: thw_s
    op: lt
    threshold: 0.6
    min_duration_s: 0.5
    merge_gap_s: 1.0
    stage: 1
    weight: 1.0

  low_ttc:
    label: "衝突余裕時間過小"
    feature: ttc_s
    op: lt
    threshold: 2.0          # Chunk_1 実測の p0.1 = 1.09
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 1
    weight: 1.5

  # 車線変更そのものは正常な操作。断定もできない (車線マーカの正解が無い) ので
  # candidate として拾うだけにし、重みは低く置く。
  # 判定量 lc_active はヨーレートの S 字パターンから作る。設定は lane_change 節。
  # --- 車両物理モデルに基づく異常挙動 --------------------------------------

  # 舵角から期待されるヨーレートと実測の乖離。滑りや制御介入で開く。
  # 閾値は残差の標準偏差 (0.341 deg/s) を単位とした σ。
  # 定常状態のモデルなので操舵の立ち上がりでも差が出る。継続時間で切り分ける。
  yaw_instability:
    label: "ヨー応答の乖離"
    feature: yaw_residual_sigma
    op: abs_gt
    threshold: 6.0
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 2
    weight: 1.5
    gate:
      - {feature: v_mps, op: gt, threshold: 10.0}
      # 通常の旋回を除く。単軌道モデルは定常状態のモデルなので、
      # 旋回の入口・出口では実測が遅れて残差が大きく出る。
      # TSS2 の 196 セグメントで実測した残差の標準偏差は
      #   全体 0.663 / v>10 で 0.449 / v>10 かつ正味方位変化<15deg で 0.392 deg/s。
      # gate を外すと 6σ 超えが全サンプルの 1.33% に達し、
      # 実際に発火した 6 件はすべて正味方位変化 33〜87 度の通常旋回だった。
      # gate を入れると 6σ 超えは 0.002%、最大でも 6.7σ になる。
      - {feature: net_heading_win_deg, op: lt, threshold: 15.0}

  # 逆操舵 (counter_steer_active) は単独のイベントにしていない。
  # カーブや車線変更の終わりでは必ず舵を戻すので、通常の操作と区別できない。
  # Chunk_1 で単独イベントとして出したときは 25 件のうち 11 件が単独候補となり、
  # 車速の中央値は 26 km/h、目視判定との対応も取れなかった。
  # 特徴量としては残し、制動との共起 (brake_and_steer) の材料にとどめる。

  # --- 複合パターン --------------------------------------------------------

  # 出て戻る S 字。車線変更 (移って留まる) と切り分ける。
  s_evasion:
    label: "S字回避"
    feature: s_evasion_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 2
    weight: 2.0

  # アクセル急 OFF から強い制動へ移る形。
  # アクセル開度を復号できていないので加速度で代用しており、単独では
  # 「前方に何も無いところでの遅れた制動」も拾う (目視判定で確認)。
  # 単独の重みは低く置き、前方の事象と重なったときだけ格上げする。
  panic_brake:
    label: "急なアクセルOFFからの制動"
    feature: panic_brake_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.2
    merge_gap_s: 1.0
    stage: 1
    weight: 0.4

  # 制動の理由が前方にあるもの。これが本来の「パニックブレーキ」。
  panic_brake_with_lead:
    label: "前方要因の急制動"
    op: cooccurrence
    base: panic_brake
    window_s: 2.0
    min_count: 1
    require_any:
      - short_thw
      - cut_in_candidate
      - closing_fast
      - low_ttc
    stage: 2
    weight: 2.0

  # 同じ先行車のまま車間が急速に詰まる。割り込みとは別の詰まり方。
  closing_fast:
    label: "急接近"
    feature: closing_fast_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.5
    merge_gap_s: 1.0
    stage: 2
    weight: 1.2
    # 渋滞の発進停止では車間時間が常に大きく動く。巡航速度域に限る。
    gate:
      - {feature: v_mps, op: gt, threshold: 15.0}

  # 制動と操舵を同時に行う回避。
  brake_and_steer:
    label: "制動＋操舵の回避"
    op: cooccurrence
    base: hard_brake
    window_s: 1.0
    min_count: 1
    require_any:
      - hard_steer
      - s_evasion
    stage: 2
    weight: 2.0

  # 回避してから制動する形。順序に意味があるので sequence で見る。
  brake_after_evasion:
    label: "回避後の制動"
    op: sequence
    first: [s_evasion, hard_steer]
    then: hard_brake
    min_gap_s: 0.0
    max_gap_s: 3.0
    stage: 2
    weight: 2.0

  # 割り込み。目視判定でリスクとされた車間逼迫はすべてこれだった。
  # 判定量は cut_in_active。設定は cut_in 節。
  cut_in_candidate:
    label: "割り込み"
    feature: cut_in_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.3
    merge_gap_s: 1.0
    stage: 2
    weight: 1.5

  lane_change_candidate:
    label: "車線変更の候補"
    feature: lc_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.5
    merge_gap_s: 0.5
    stage: 2
    weight: 0.2

  # 車線変更に危険側の指標が重なったときだけ立てる。
  # 通常の車線変更と分けるのが目的なので、重みは高く置く。
  risky_lane_change:
    label: "危険な車線変更の疑い"
    op: cooccurrence
    base: lane_change_candidate
    window_s: 2.0             # 車線変更の前後どこまでを共起とみなすか
    min_count: 1              # 重なった指標の種類数の下限
    require_any:
      - short_thw
      - cut_in_candidate
      - closing_fast
      - low_ttc
      - hard_steer
      - lateral_accel
      - hard_brake
      - abs_active
      - vsc_active
      - aeb_active
      - wheel_speed_anomaly
      # ESC / TCS の介入フラグは DBC に存在しないため入れられない
    stage: 2
    weight: 2.0

  # 判定量は 0x226 の ABSACT。0x320 の FABS は故障フラグで、
  # ABS が作動している区間でも 0 のままだった (docs/comma_car_segments.md)。
  abs_active:
    label: "ABS 作動"
    feature: abs_active_flag
    op: rising
    threshold: 0.5
    min_duration_s: 0.0
    merge_gap_s: 1.0
    stage: 2
    weight: 2.0

  # VSC (横滑り防止) の作動。ABSACT と同じメッセージにある。
  vsc_active:
    label: "VSC 作動"
    feature: vsc_active_flag
    op: rising
    threshold: 0.5
    min_duration_s: 0.0
    merge_gap_s: 1.0
    stage: 2
    weight: 2.5

  # 純正の衝突被害軽減ブレーキ (PCS)。前方カメラがバス 2 に出す。
  # 作動していれば、車両自身が衝突の危険を判断したことの直接の証拠になる。
  # commaCarSegments の TSS2 でのみ復号できる (comma2k19 の RAV4 には列が無い)。
  aeb_active:
    label: "純正 AEB 作動"
    feature: precollision_active
    op: rising
    threshold: 0.5
    min_duration_s: 0.0
    merge_gap_s: 1.0
    stage: 2
    weight: 2.5

  # アクセル開度が読める場合の急制動。縦加速度で代用した panic_brake と違い、
  # 「踏んでいた → 離した → 制動」という運転者の動作そのものを見る。
  # 設定は panic_brake.pedal 節。
  panic_brake_pedal:
    label: "アクセルOFFからの急制動 (ペダル判定)"
    feature: panic_brake_pedal_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.2
    merge_gap_s: 1.0
    stage: 2
    weight: 1.0

  # 旋回中の逆方向への操舵。
  # 単独ではカーブや車線変更の終わりの舵戻しと区別できないため、
  # Chunk_1 では特徴量にとどめていた (25 件中 11 件が単独候補になり、
  # 車速中央 26 km/h で目視判定とも対応しなかった)。
  # スクリーニングでは実データ上の存在を確かめたいので、
  # 通常の旋回を除く gate を付けたうえでイベントとして出す。重みは低く置く。
  counter_steer:
    label: "逆操舵"
    feature: counter_steer_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.2
    merge_gap_s: 1.0
    stage: 2
    weight: 0.3
    gate:
      - {feature: v_mps, op: gt, threshold: 10.0}
      - {feature: net_heading_win_deg, op: lt, threshold: 15.0}

  # 旋回で説明できない輪速のばらつき。設定は wheel_speed 節。
  # 判定量 ws_anomaly_active は、超過に加えて
  # 加減速・ヨー応答の乖離・ABS のいずれかの裏付けが取れた区間だけ 1 になる。
  wheel_speed_anomaly:
    label: "輪速の異常"
    feature: ws_anomaly_active
    op: gt
    threshold: 0.5
    min_duration_s: 0.2
    # 離れた単発を 1 件にまとめない。まとめるとノイズの尖りが
    # 継続時間の条件を通ってしまう (平滑化前の実測で 16 件すべてがこれだった)。
    merge_gap_s: 0.3
    stage: 2
    weight: 1.5

# ---------------------------------------------------------------------------
# 候補区間の統合とスコア付け
# ---------------------------------------------------------------------------
scoring:
  window_pad_s: 2.0       # 各イベントの前後をこれだけ広げてから統合する
  merge_gap_s: 2.0        # この間隔以内の区間はひとつの候補にまとめる
  cooccurrence_bonus: 0.5 # 異なる種類のイベントが重なったときの加点係数
  max_severity_per_event: 3.0

# ---------------------------------------------------------------------------
# 定義していないイベント
#
# スリップ: ws_spread_mps 単独では判定しない方針は変えていない。
#   ESP_CONTROL (0x3B7) のビット定義を入手したが、介入フラグは存在しなかった
#   (TC_DISABLED / VSC_DISABLED は「無効化されているか」であって作動ではない)。
#   そのため wheel_speed_anomaly では、TCS/ESC の代わりに
#   縦加速度・ヨー応答の乖離・ABS を裏付けに使っている。
#   「スリップ」とは名乗らず、輪速の異常として扱う。
#
# 急車線変更: 時間パターンの照合が要るため未実装。docs/near_miss_filters.md 4 章。
# ---------------------------------------------------------------------------
