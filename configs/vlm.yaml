# VLM review layer (後段) の設定
#
# 既存の抽出ロジック (detectors / scoring / sideslip / features) は変更しない。
# ここは candidates.csv と labels.csv を入力とする独立した後段レイヤの設定。
#
# Phase 1 は探索的 PoC。人手確認済みの 32 件 (positive 8 / negative 24) だけを使う。
# 「フィルタで落ちた = negative」とは扱わない。negative は人手確認済みに限る。
#
# モデルを差し替えても入力生成・prompt・schema・評価は変えない。
# 変わってよいのは重み・chat template・視覚トークン化だけ (adapters が吸収する)。

prompt_version: v1
prompts:
  clip: configs/prompts/vlm_v1_clip.md
  online: configs/prompts/vlm_v1_online.md

# 一括判定 (モード A) の映像フレーム数の上限。
# 候補は最大 29.2 秒あり、2 fps でそのまま出すと 58 枚 = 約 9,000 視覚トークンに
# なる。区間全体から等間隔で間引いて上限に収める。モード B は窓が 4 秒固定
# なので常に 8 枚で、この上限にはかからない。
clip_max_frames: 16

# ---------------------------------------------------------------------------
# 入力の作り方。**モデル間で絶対に動かさない**。
#   視覚トークン数ではなくピクセル予算を固定する。パッチサイズもマージ率も
#   モデルごとに違うので、トークン数を揃えると入力画像そのものが変わってしまう。
#   同じ画像を渡し、結果として生じたトークン数をモデルごとに記録して併記する。
# ---------------------------------------------------------------------------
input:
  video_long_edge: 640      # 元は 1164x874。長辺をここへ縮める
  video_fps: 2.0            # 窓内から抜き出すフレームレート
  window_video_s: 4.0       # 評価時刻 t から遡る映像の長さ -> 8 フレーム
  window_can_s: 6.0         # 同じく CAN の長さ
  can_rate_hz: 2.0          # 20 Hz グリッドから間引く先 -> 12 行

  # 映像の履歴が足りない時刻の扱い。
  #
  # ドライブの先頭付近では、評価時刻そのものは手元にあっても 4 秒前が
  # 無いことがある (実測: P08 は seg1 の 0.60 秒から始まるが seg0 が無い)。
  # ここで時刻ごと捨てると、立ち上がりを見たいまさにその区間が消える。
  #
  # そこで**短い窓のまま渡し、そのことを記録する**。フレーム数が変わると
  # 入力の分布も変わるので、隠さずに n_frames / hist_s / partial_window を
  # リクエストに載せ、採点側で層別できるようにする。
  min_video_frames: 1

# ---------------------------------------------------------------------------
# CAN 文脈の因果性
#
# features.py の特徴量は**すべて中心合わせ**で計算されている。
#   derivative()     中心差分            ±0.05 s
#   rolling()        center=True         ±(窓/2)
#   moving_average() 対称カーネル        ±(窓/2)
# したがって時刻 t の ax_mps2 は t+0.25 s までのサンプルを見ている。
# 積算すると *_win_* 系で最大 ±0.45 s の未来漏れになる。
#
#   guard  : CAN を t - guard_s までに切る。既存の compute_features をそのまま使う
#   causal : 後ろ向きフィルタで再計算する (将来の差し替え先。未実装)
#
# guard_s は結果メタに必ず記録する。検出遅れの分解能の下限を決めるため。
# ---------------------------------------------------------------------------
context:
  mode: guard
  guard_s: 0.5
  # モード B で入力に混ぜてはならない列。候補区間全体を見て算出された値であり、
  # 与えた瞬間にモデルは未来を知る。tests/test_vlm_causality.py が機械的に検査する。
  forbidden_columns:
    - severity
    - event_types
    - n_events
    - grade
    - confidence_items
    - t_peak
    - reasons
    - corroboration
  forbidden_suffixes: ["_min", "_max", "_absmax", "_mean"]

  # モデルに見せる列。20 Hz グリッドの生の特徴量だけを使う。
  # (列名, 表示名, 単位, 小数桁, 倍率)
  columns:
    - [v_mps,          速度,     "km/h", 1, 3.6]
    - [ax_mps2,        前後加速度, "m/s2", 2, 1.0]
    - [ay_kin_mps2,    横加速度,  "m/s2", 2, 1.0]
    - [yaw_rate_dps,   ヨーレート, "deg/s", 1, 1.0]
    - [steer_deg_s,    舵角,     "deg",  1, 1.0]
    - [brake_pressed,  制動,     "-",    0, 1.0]
    - [thw_s,          車間時間,  "s",    2, 1.0]
    - [ttc_s,          衝突余裕,  "s",    2, 1.0]

# ---------------------------------------------------------------------------
# 評価時刻の並べ方 (モード B)
#   候補長は 4.5〜29.2 秒とばらつくので、t_peak 中心の固定窓は使えない。
#   候補区間そのものを基準にする。
# ---------------------------------------------------------------------------
timeline:
  pre_s: 6.0                # t_start からこれだけ前に遡って評価を始める
  post_s: 2.0               # t_end からこれだけ後まで評価する
  stride_s: 0.5

# 警報の立ち上がり判定。1 時刻のちらつきを警報として数えない。
alarm:
  states: [caution, hazard]
  debounce_steps: 2

# ---------------------------------------------------------------------------
# 復号。モデル間で共通。
#   既定は temperature 0。このとき 3 反復は**再現性確認**であって自己一致率ではない。
#   自己一致率を主指標にするのは temperature > 0 のアームだけ。
# ---------------------------------------------------------------------------
decode:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  max_tokens: 512

repeats:
  mode_a: 3                 # 再現性確認 (temperature=0 のため)
  mode_b: 1

# ---------------------------------------------------------------------------
# comma2k19 の固定値。データセットの性質であって調整対象ではない。
# ---------------------------------------------------------------------------
video:
  fps: 20.0
  segment_len_s: 60.0
  # 大半のセグメントは 1200 フレーム (60.00 秒) ちょうどだが、実測で 1201 の
  # ものがある (2018-08-03--10-35-16/12 は 60.05 秒)。この値は境界での丸め上がりを
  # 次セグメントへ送るためだけに使うので、1 フレームの差は判定に影響しない。
  frames_per_segment: 1200

# ---------------------------------------------------------------------------
# モデル。tier 1 を初期比較、tier 2 を上位比較とする。
#
# Qwen2.5-VL-7B と Cosmos-Reason1-7B は同一ベース・同一パラメータ数なので、
# 差は事後学習だけに帰着する。「運転特化 post-training の効果」を
# 他の変数を固定したまま測れる。
#
# Alpamayo 系はカメラ較正・自車軌跡など入力要件が異なり、同一入力での比較が
# 成立しない。別 adapter・別比較枠とし、この表には並べない。
# ---------------------------------------------------------------------------
models:
  qwen2_5_vl_7b:
    adapter: qwen_vl
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    tier: 1
    note: "基準"
  cosmos_reason1_7b:
    adapter: qwen_vl
    model_id: "nvidia/Cosmos-Reason1-7B"
    tier: 1
    note: "Qwen2.5-VL-7B ベース。運転/物理特化 post-training の効果を見る"
  qwen3_vl_8b:
    adapter: qwen_vl
    model_id: "Qwen/Qwen3-VL-8B-Instruct"
    tier: 1
    note: "世代差"
  qwen3_vl_30b_a3b:
    adapter: qwen_vl
    model_id: "Qwen/Qwen3-VL-30B-A3B-Instruct"
    tier: 2
    note: "MoE。活性 3B なので 7B 級の速度で規模の効果を見る"

# 一括判定の条件。D は既存フィルタの結果をヒントとして与えるアブレーションで、
# 独立性能の比較には含めない (別表にする)。
conditions:
  A: {video: false, can: true,  hint: false, note: "CAN のみ"}
  B: {video: true,  can: false, hint: false, note: "映像のみ"}
  C: {video: true,  can: true,  hint: false, note: "映像 + CAN (本命)"}
  D: {video: true,  can: true,  hint: true,  note: "C + event_types (アブレーション)"}
