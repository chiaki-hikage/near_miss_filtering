# ZOD full Phase 3: 気象観測との照合 (scripts/zod/full_weather.py) の設定。説明: docs/zod_full_weather.md
# 判定の規則と閾値は、結果を見る前 (2026-11-12、取得の前) にここに書いた。結果に合わせて変えない。

screening_run: out/zod/full_screening/20261112_r6     # Phase 2 の結果 (モデル・閾値はそのまま使う)
inventory_run: out/zod/full_inventory/20261112_r2
candidate_hypotheses: ["ヨーの変化が先 (外乱の候補)", "持続的なずれ (当て舵・路面の傾き・ゼロ点・横風)"]

fetch:
  out_dir: data/zod_weather/phase3          # 今回の取得の保存先と記録 (既存の data/zod_weather/fetch_log.csv には書き足さない)
  reuse_dirs: [data/zod_weather]            # 取得済みのファイルを探す所 (同じ名前のファイルがあれば取らない)
  max_total_mb: 260                         # 計画の合計の上限 (ユーザーの許可は約 260 MB)。候補・対照の観測所は必ず含め、比べる区間の観測所は多く使われる順にここまで
  max_mb_per_file: 30
  smhi_params: [4, 3]                       # 風速・風向 (10 分平均、毎正時)。21 (最大瞬間風速) は時刻が分からないので取らない
  smhi_mb_per_file_est: 8.5                 # 前回の実測 (p4・p3 の corrected-archive、6.7〜8.6 MB)
  dwd_products:                             # 10 分値の風と、10 分値の極値 (FX_10 は 10 分の中の最大で、その中の時刻は分からない)
    wind_10min: 10_minutes/wind/historical
    extreme_wind_10min: 10_minutes/extreme_wind/historical
  dwd_mb_per_station_est: 3.8
  date_from: "20220101"                     # 2022 年を含むファイルだけ (DWD は期間ごとの zip)
  date_to: "20221231"

stations:
  radius_km: 50
  max_station_height_m: 500                 # これより高い観測所 (山頂) は道路の高さの風を代表しないので使わない。
                                            # 取得の後に Brocken (1135 m) の 10 分の最大瞬間風速 34〜36 m/s を見て足した規則 (事後に足したことを記録する)
  max_per_point: 4                          # 1 地点につき近い順にこの数まで (取得元ごとではなく合わせて)
  active_from: "2022-01-01"
  active_to: "2022-09-30"

match:
  dwd_max_gap_min: 10                       # 観測の時刻との差の上限 (10 分値)
  smhi_max_gap_min: 30                      # 毎正時の 1 値
  idw_power: 2
  idw_min_stations: 2
  temporal_window_min: 60                   # 前後 60 分の観測の標準偏差 (時間の変動)
  single_station_sigma: 4.5                 # 観測所が 1 つのときの横風成分の不確かさ (mini の観測所間の差の上限。docs/zod_weather_poc.md)
  vehicle_height_factor: [0.6, 0.85]        # 10 m の風 → 車の高さ (1〜2 m) の風の比 (対数則、粗度 0.03〜0.3 m の幅。仮定)

physics:                                    # 線形 2 輪モデルの定常の考え方と、横風の必要量の見積もり (仮定。configs/zod/crosswind_sensitivity.yaml と同じ値)
  mass_kg: 2000
  area_m2: 2.8
  rho: 1.2
  cy_per_rad: [1.5, 3.5]
  # 横風に必要な車の高さの横風成分 W_req = 2·m·A_steer / (ρ·A·C_Y·v)   (A_steer = 舵角が求める横加速度の異常 = −v·Δr)
  bank_ratio_explains: [0.5, 1.5]           # 勾配の確かめ: A_bank / A_steer がこの範囲なら「横断勾配で説明できる」
  bank_ratio_small: 0.25                    # |A_bank / A_steer| がこれ未満なら「傾きでは説明できない」

judgement:                                  # 持続型の判定 (どれにも当たらなければ「不明」)
  # 支持: 推定の横風成分の区間 (IDW ± 不確かさ) が、期待の向きで、必要量の下限 × 高さの比の下限 以上に届く、かつ傾きでは説明できない
  # 反証: (a) 推定の区間が期待と逆向きで 0 をまたがない、または (b) 区間の上限 × 高さの比の上限 が必要量の下限の 1/3 未満、
  #       または (c) 傾きで説明できる
  weak_upper_fraction: 0.333
  # 突発型: 10 分の最大瞬間風速 (DWD FX_10) が感度分析の検出限界 (中央の仮定 x_cp 0.7 m で 90〜120 km/h は 3〜5 m/s) を下回れば反証寄り
  gust_needed_ms: 5.0

compare:
  segment_s: 60                             # 判定の対象 (80 km/h 以上・直進) を 60 s ずつに区切る
  min_screened_s: 30
  strong_cross_ms: 5.0                      # |横風成分 (IDW、10 m)| ≥ 5 m/s を強い横風、< 2 m/s を弱い横風 (事前に決めた値)
  weak_cross_ms: 2.0
  strong_speed_ms: 8.0                      # 10 分平均の風速 ≥ 8 m/s を強風
  bootstrap: 2000                           # 走行の単位のブートストラップ
  seed: 20261112
  match_speed_tol_kmh: 10                   # 候補と比べる非候補の区間: 同じ車両、速さ ±10 km/h
