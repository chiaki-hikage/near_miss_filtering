# 週次報告 PPT の設定 (scripts/report/build_weekly_pptx.py)
# 作る手順は .claude/skills/weekly-slides/SKILL.md。PPT を作る時期はユーザーが決める
#
# 社内テンプレートが見つからなかったので (2026-11-11、~/Documents・~/Desktop・~/Downloads・
# Office のテンプレートの場所を探した)、暫定テンプレートをスクリプトの中で組み立てる。
# 社内テンプレートが手に入ったら template に .pptx / .potx のパスを書く。
# そのときは、テンプレートの最初のスライドレイアウト (白紙) の上に、下の座標で配置する。

template: null

slide:
  width_in: 13.333        # 16:9
  height_in: 7.5

# 暫定テンプレート
theme:
  font: Meiryo            # 日本語。Office 標準。無い環境では PowerPoint が置き換える
  font_mono: Consolas     # 根拠のパス
  color_title: "1F2A44"   # 濃紺: タイトル
  color_text: "222222"
  color_muted: "6B7280"   # 補足・根拠
  color_accent: "2F6FB0"  # 見出しの帯・区切り
  color_band_text: "FFFFFF"
  color_table_head: "E8EEF6"
  size_title: 24
  size_message: 18        # 主文
  size_notes: 13          # 注釈
  size_table: 12
  size_small: 10.5

limits:
  min_slides: 5           # 毎週 5〜7 枚
  max_slides: 7
  max_message_chars: 60   # 主文は 1 文。長ければ注意を出す (誤りにはしない)
  max_table_rows: 8
  max_notes: 4

# 1 枚の配置: タイトル → 主文 → 図か表 + 注釈 (右か下) → 根拠
layout:
  margin_in: 0.6
  message_h_in: 0.75      # 主文の枠 (2 行まで)
  footer_h_in: 0.55
  notes_position: right   # 注釈の既定の位置。スライドごとに layout: below で変えられる
  visual_ratio: 0.66      # right のとき、図表が使う幅の割合
  notes_below_h_in: 1.3   # below のときの注釈と根拠の高さ
  table_row_h_in: 0.38

# 前回報告からの変更点 (scripts/report/weekly_changes.py)
changes:
  index: experiments/index.csv
  # 変更の分類 (パスの先頭 → 区分)。上から順に最初に一致したもの
  areas:
    - ["src/", "コード (src)"]
    - ["scripts/", "スクリプト"]
    - ["configs/", "設定"]
    - ["tests/", "試験"]
    - ["docs/", "文書"]
    - ["experiments/", "実験索引"]
    - ["reports/", "報告"]
    - ["shared/", "共有資料"]
    - ["", "その他"]
  # 索引で比べる手書きの列 (変化があれば報告に載せる)
  index_cols: [current_use, doc_label, verification, decision, check_priority]
