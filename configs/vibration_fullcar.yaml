# 7 自由度 Full-car モデルのパラメータ (Toyota RAV4 2017, XA40, comma2k19 Chunk 1-2)
#
# source の区分
#   known    公開諸元。出典は docs/vibration_fullcar_model.md 3 章
#   derived  公開諸元・実測から計算した値
#   assumed  公開資料が見つからず、同クラス車の一般的な値を置いた仮定
# range は感度分析で振る幅。仮定値ほど広く取る。
#
# comma2k19 の車両が FWD / AWD / ハイブリッドのどれかは分かっていない (要確認)。

vehicle:
  mass_total_kg:        {value: 1680.0, range: [1600.0, 1880.0], source: derived,
                         note: "車両重量 1,567〜1,635 kg (FWD/AWD 公開値) + 乗員・機器 80 kg (仮定)。上限はハイブリッド相当"}
  wheelbase_m:          {value: 2.660, source: known, note: "104.7 in。configs/vehicles/toyota_rav4.yaml と同じ"}
  track_front_m:        {value: 1.570, source: known, note: "61.8 in"}
  track_rear_m:         {value: 1.570, source: known, note: "61.8 in"}
  cg_to_front_m:        {value: 1.1704, range: [1.05, 1.30], source: assumed,
                         note: "ホイールベースの 0.44 倍。既存の車種設定と同じ仮定"}
  cg_height_m:          {value: 0.65, range: [0.58, 0.72], source: assumed}
  roll_axis_height_m:   {value: 0.12, range: [0.05, 0.20], source: assumed, note: "前後ロールセンタの平均"}
  pitch_axis_height_m:  {value: 0.0, source: assumed, note: "アンチダイブ・アンチスクォートは無視"}
  inertia_roll_kgm2:    {value: 650.0, range: [500.0, 800.0], source: assumed, note: "ばね上の Ixx"}
  inertia_pitch_kgm2:   {value: 2600.0, range: [2100.0, 3100.0], source: assumed, note: "ばね上の Iyy"}

unsprung:
  mass_front_kg:        {value: 45.0, range: [38.0, 52.0], source: assumed, note: "1 輪あたり"}
  mass_rear_kg:         {value: 40.0, range: [33.0, 47.0], source: assumed}

suspension:
  # ばね定数はばね上の固有振動数から決める。実測の上下振動の主成分 (1.4〜2.0 Hz) とも矛盾しない
  ride_freq_front_hz:   {value: 1.35, range: [1.2, 1.6], source: assumed}
  ride_freq_rear_hz:    {value: 1.50, range: [1.3, 1.8], source: assumed}
  damping_ratio:        {value: 0.30, range: [0.2, 0.45], source: assumed}
  # スタビライザーは全体のロール勾配から決める
  roll_gradient_deg_per_g: {value: 5.5, range: [4.0, 7.0], source: assumed}
  roll_stiffness_front_share: {value: 0.60, range: [0.5, 0.7], source: assumed}

tire:
  size: "P225/65R17"
  # ばね下の共振 (wheel hop) が実測の 11.5〜11.7 Hz (上下加速度の主周波数、振動イベント上位) に
  # 合うように選んだ。ばね下質量と組で決まるため、片方だけは識別できない
  stiffness_n_per_m:    {value: 200000.0, range: [170000.0, 260000.0], source: derived}
  damping_ns_per_m:     {value: 100.0, source: assumed}
  envelope_length_m:    {value: 0.15, range: [0.08, 0.25], source: assumed,
                         note: "接地長。路面形状をこの長さで平均してタイヤの包み込みを近似する"}

imu:
  # comma EON はフロントガラス上部 (ルームミラー付近) に付く。車両上の位置は記録が無い
  pos_from_cg_m:        {value: [0.55, 0.0, 0.65], source: assumed,
                         note: "[前, 右, 上]。前後位置は ±0.3 m、左右は ±0.15 m を感度分析で振る"}

measurement:
  imu_rate_hz: 104.3
  can_yaw_lag_s: 0.021   # CAN YAW_RATE は IMU より約 21 ms 遅い (相互相関、43 セグメントの中央値)
