[project]
name = "near-miss-filtering"
version = "0.1.0"
description = "自動運転データセットからヒヤリハット候補・横滑り候補を抽出する"
requires-python = ">=3.10,<3.13"

# --- 常に要るもの ---------------------------------------------------------
# 横滑り 2 段フィルタ (screen_sideslip.py) を commaCarSegments / comma2k19 で
# 動かすのに必要な一式。pycapnp と zstandard は rlog の読み出しに要る。
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.10",          # calibrate_beta_noise.py の当てはめ
    "pycapnp>=2.0",         # rlog (openpilot のログ) は capnp 形式
    "zstandard>=0.21",      # rlog.zst の展開
    "requests>=2.31",       # セグメントの取得
]

[project.optional-dependencies]
# 図を描く場合のみ。CI や EC2 でのバッチ実行には要らない。
viz = ["matplotlib>=3.7"]

# comma1M (位置情報・天候スクリーニング) を扱う場合のみ。
comma1m = [
    "safetensors>=0.4",
    "pymap3d>=3.0",
    "reverse_geocoder>=1.5",
    "Pillow>=10.0",
]

# comma2k19 の demo split (parquet) を取得する場合のみ。
demo-dataset = ["pyarrow>=12.0"]

# EC2 で検証用データを S3 から raw_data/ へ取り込む場合のみ (scripts/fetch_from_s3.py)。
# 認証は IAM Role (インスタンスプロファイル) 経由。鍵は持たせない。
# Mac ではローカルの raw_data/ を直接使うので、この extra は要らない。
s3 = ["boto3>=1.34"]

dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: 実データとプロセス起動が要るもの。'-m \"not slow\"' で外せる",
]

[tool.uv]
# 既定でこれらを入れる。EC2 でも Mac でも同じものが入るようにしておく。
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/near_miss"]
